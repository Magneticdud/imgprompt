[package]
name = "imgprompt-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop front-end for imgprompt (Tauri prototype)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dotenvy = "0.15"
imgprompt-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
