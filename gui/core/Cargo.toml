[package]
name = "imgprompt-core"
version = "0.1.0"
edition = "2021"
description = "Rust port of the imgprompt provider layer (prototype: OVH only)"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
